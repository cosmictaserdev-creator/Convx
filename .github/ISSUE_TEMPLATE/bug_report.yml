name: Bug report
description: Something is broken
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Fill this out as concretely as you can — a repro we can follow is worth more than a
        description of how frustrating the bug is.

  - type: checkboxes
    id: checklist
    attributes:
      label: Before you post
      options:
        - label: I am on the [latest build](https://github.com/MeYashverma/Convxy/actions) or release.
          required: true
        - label: I searched for an existing issue about this.
          required: true

  - type: dropdown
    id: component
    attributes:
      label: Where does it happen?
      description: The area of the app.
      options:
        - Player (now playing)
        - Library / playlists
        - Search
        - Lyrics
        - Ambient Mode
        - YouTube section
        - Downloads / cache
        - Settings
        - Android Auto
        - Listen Together
        - Widgets / notification
        - Other
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: How often
      options:
        - Every time
        - Most of the time
        - Sometimes
        - Once or twice
    validations:
      required: true

  - type: textarea
    id: reproduce-steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps, from opening the app to seeing the bug.
      placeholder: |
        1. Open the player
        2. Tap ...
        3. What happens
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected-actual
    attributes:
      label: Expected vs. actual
      placeholder: |
        Expected: the next track starts.
        Actual: playback stops and the notification disappears.
    validations:
      required: true

  - type: dropdown
    id: android-version
    attributes:
      label: Android version
      options:
        - Android 16
        - Android 15
        - Android 14
        - Android 13
        - Android 12
        - Android 11
        - Android 10
        - Android 9 or older
        - Custom ROM
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device
      placeholder: e.g. Pixel 7a, or a note about the car head unit for Android Auto bugs
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: App version
      description: Settings → About shows the version and build.
      placeholder: e.g. 1.7.0
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots, recordings
      description: >
        Paste `adb logcat` output for crashes, and drag images in for anything visual. For playback
        or sync bugs, the in-app playback log (share icon on the error dialog) is more useful than
        a description — it lists every client attempt. A short recording beats both.
      render: shell
