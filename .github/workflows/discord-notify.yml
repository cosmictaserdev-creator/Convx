name: Discord Release Notification

on:
  release:
    types: [published]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TAG: ${{ github.event.release.tag_name }}
          NAME: ${{ github.event.release.name }}
          URL: ${{ github.event.release.html_url }}
          BODY: ${{ github.event.release.body }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          # Truncate to Discord's 4096-char description limit
          BODY_TRIMMED=$(printf '%s' "${BODY}" | head -c 4000)

          if [ "$PRERELEASE" = "true" ]; then
            COLOR=16776960
            TYPE="Nightly Build"
          else
            COLOR=5763719
            TYPE="Stable Release"
          fi

          # Build the embed with jq to safely escape JSON
          PAYLOAD=$(jq -n \
            --arg title "Convxy $TAG - $TYPE" \
            --arg desc "${BODY_TRIMMED:-No description provided.}" \
            --arg url "$URL" \
            --argjson color "$COLOR" \
            --arg version "$TAG" \
            --arg type "$TYPE" \
            --arg time "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{embeds: [{title: $title, description: $desc, url: $url, color: $color, fields: [{name: "Version", value: $version, inline: true}, {name: "Type", value: $type, inline: true}, {name: "Download", value: "[GitHub Release](\($url))", inline: false}], footer: {text: "Convxy Music - Open Source"}, timestamp: $time}]}')

          curl -s -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"
