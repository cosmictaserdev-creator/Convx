name: Stable Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build_stable:
    name: Build GitHub APK variants
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate debug.keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE }}
        run: |
          mkdir -p app/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > app/keystore/release.keystore

      - name: Build Universal GMS Release APK
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleUniversalGmsRelease assembleArm32GmsRelease assembleUniversalFossRelease assembleArm32FossRelease -PgithubUpdater=true --no-configuration-cache --console=plain --warning-mode summary -x lint

      - name: Prepare APKs and updater metadata
        env:
          UPDATER_IMAGE_URL: ${{ vars.UPDATER_IMAGE_URL }}
        run: |
          VERSION=$(sed -n 's/^VERSION_MAJOR=//p' version.properties).$(sed -n 's/^VERSION_MINOR=//p' version.properties).$(sed -n 's/^VERSION_PATCH=//p' version.properties)
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          test "${TAG#v}" = "$VERSION"
          VERSION_CODE=$(python3 -c 'import sys; a,b,c=(int(v) for v in sys.argv[1].split(".")); print((a*10000+b*100+c)*10000+9999)' "$VERSION")
          cp app/build/outputs/apk/universalGms/release/*.apk convx-universal-gms.apk
          cp app/build/outputs/apk/arm32Gms/release/*.apk convx-arm32-gms.apk
          cp app/build/outputs/apk/universalFoss/release/*.apk convx-universal-foss.apk
          cp app/build/outputs/apk/arm32Foss/release/*.apk convx-arm32-foss.apk
          IMAGE_ARGS=()
          if [ -n "${UPDATER_IMAGE_URL:-}" ]; then IMAGE_ARGS+=(--image "$UPDATER_IMAGE_URL"); fi
          python3 tools/publish_updater_metadata.py --version "$VERSION" --version-code "$VERSION_CODE" --release-notes ".github/release-notes/$TAG.md" --output updater.json "${IMAGE_ARGS[@]}" convx-universal-gms.apk convx-arm32-gms.apk convx-universal-foss.apk convx-arm32-foss.apk

      - name: Upload APKs and updater metadata to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          gh release upload "$TAG" convx-universal-gms.apk convx-arm32-gms.apk convx-universal-foss.apk convx-arm32-foss.apk updater.json --repo "${{ github.repository }}" --clobber
