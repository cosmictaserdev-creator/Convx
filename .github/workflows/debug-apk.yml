name: Debug APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew :app:assembleUniversalGmsDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: app-universal-gms-debug
          path: app/build/outputs/apk/**/*.apk
