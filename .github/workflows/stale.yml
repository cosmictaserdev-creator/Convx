name: "❄️ Stale Issue Handler"
on:
  schedule:
    - cron: "30 1 * * *"

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          stale-issue-message: "This issue has had no activity for 60 days, so it is marked stale. If it still happens on the latest nightly, please leave a comment. Otherwise it will be closed in 7 days."
          stale-issue-label: "no-activity"
          days-before-stale: 60
          days-before-close: 7
          exempt-issue-labels: "security,pinned,crash,hard bug,status: confirmed,status: in progress"
